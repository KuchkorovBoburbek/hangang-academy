name: hangang-academy
x-common: &common
  image: hangang-academy:local
  env_file: .env
  environment:
    NODE_ENV: production
    DEMO_MODE: 'false'
    DATA_DIR: /app/data
    BACKUP_DIR: /app/backups
  volumes:
    - academy-data:/app/data
    - academy-backups:/app/backups
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
services:
  app:
    <<: *common
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    command: ['sh', '-c', 'npm run db:seed && npm run db:topik && exec npm start']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  worker:
    <<: *common
    command: ['npm', 'run', 'worker']
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 11m
  backup:
    <<: *common
    command: ['node', '--import', 'tsx', 'scripts/backup-worker.ts']
    depends_on:
      app:
        condition: service_healthy
volumes:
  academy-data:
  academy-backups:
